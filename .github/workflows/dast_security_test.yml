name: 🛡️ DAST Security Test — Aero-Navigator API

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:          # allows manual trigger from Actions tab

jobs:
  dast-security-test:
    name: API Security Test Suite
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ──────────────────────────────────────────────────
      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aero-navigator-web/package-lock.json

      # ── 3. Install server dependencies ────────────────────────────────────
      - name: 📦 Install Server Dependencies
        working-directory: aero-navigator-web
        run: npm install

      # ── 4. Install DAST test dependencies (none needed — pure Node builtins) ─
      - name: 📦 Install ExcelJS for Report Generation
        working-directory: aero-navigator-web
        run: |
          # ExcelJS already in selenium-web-tests — install standalone for DAST report
          npm install --save-dev exceljs

      # ── 5. Start the server in the background ─────────────────────────────
      - name: 🚀 Start Aero-Navigator Server
        working-directory: aero-navigator-web
        run: |
          node server.js &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          # Wait up to 20s for the server to be ready
          for i in $(seq 1 20); do
            curl -sf http://localhost:3000/api/session > /dev/null 2>&1 && echo "✅ Server ready" && break
            echo "⏳ Waiting for server... ($i/20)"
            sleep 1
          done

      # ── 6. Run DAST Test Suite ────────────────────────────────────────────
      - name: 🛡️ Run DAST Security Tests
        working-directory: aero-navigator-web
        run: |
          node automated_test/dast_runner.js
        continue-on-error: true   # keep running even if findings exist

      # ── 7. Generate HTML Report ───────────────────────────────────────────
      - name: 📊 Generate HTML Report
        working-directory: aero-navigator-web
        run: node automated_test/generate_html_report.js
        continue-on-error: true

      # ── 8. Stop the server ────────────────────────────────────────────────
      - name: 🛑 Stop Server
        if: always()
        run: kill $SERVER_PID 2>/dev/null || true

      # ── 9. Upload all artifacts ───────────────────────────────────────────
      - name: 📤 Upload DAST Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-security-report-${{ github.run_number }}
          path: |
            aero-navigator-web/automated_test/report.json
            aero-navigator-web/automated_test/dast_report.html
            aero-navigator-web/automated_test/savepoint.json
          retention-days: 30

      # ── 10. Print summary to Actions log ─────────────────────────────────
      - name: 📋 Print Summary to GitHub Step Summary
        if: always()
        working-directory: aero-navigator-web
        run: node automated_test/print_summary.js >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      # ── 11. Fail the job if CRITICAL findings exist ───────────────────────
      - name: ❌ Fail on CRITICAL Findings
        working-directory: aero-navigator-web
        run: |
          CRITICAL=$(node -e "
            const r = require('./automated_test/report.json');
            const c = r.filter(x => x.finding && x.severity === 'CRITICAL').length;
            console.log(c);
          ")
          echo "Critical findings: $CRITICAL"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "::error::🔴 $CRITICAL CRITICAL security finding(s) detected. Review the DAST report artifact."
            exit 1
          fi
