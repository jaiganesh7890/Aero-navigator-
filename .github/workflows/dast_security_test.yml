name: 🛡️ DAST Security Test — Aero-Navigator API

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  SESSION_SECRET: ci-test-session-secret-aero-2026-github-actions

jobs:
  dast-security-test:
    name: API Security Test Suite
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Node.js setup ─────────────────────────────────────────────────────
      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aero-navigator-web/package-lock.json

      # ── 3. Install server + test dependencies ────────────────────────────────
      - name: 📦 Install Dependencies
        working-directory: aero-navigator-web
        run: npm ci

      # ── 4. Start server in background ────────────────────────────────────────
      - name: 🚀 Start Aero-Navigator Server
        working-directory: aero-navigator-web
        env:
          SESSION_SECRET: ${{ env.SESSION_SECRET }}
          PORT: 3000
        run: |
          node server.js &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          echo "⏳ Waiting for server to be ready..."
          for i in $(seq 1 25); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/session 2>/dev/null || echo "0")
            if [ "$STATUS" = "401" ] || [ "$STATUS" = "200" ]; then
              echo "✅ Server ready (HTTP $STATUS) after ${i}s"
              break
            fi
            echo "  Attempt $i/25: HTTP $STATUS — waiting..."
            sleep 1
          done

      # ── 5. Run DAST Test Suite ────────────────────────────────────────────────
      - name: 🛡️ Run DAST Security Tests
        working-directory: aero-navigator-web
        env:
          SESSION_SECRET: ${{ env.SESSION_SECRET }}
        run: node automated_test/dast_runner.js
        continue-on-error: true

      # ── 6. Generate Excel Report ──────────────────────────────────────────────
      - name: 📊 Generate Excel Security Report
        working-directory: aero-navigator-web
        env:
          SESSION_SECRET: ${{ env.SESSION_SECRET }}
        run: node automated_test/generate_excel_report.js
        continue-on-error: true

      # ── 7. Print Markdown Summary to Actions UI ───────────────────────────────
      - name: 📋 Write Step Summary
        working-directory: aero-navigator-web
        env:
          SESSION_SECRET: ${{ env.SESSION_SECRET }}
        run: node automated_test/print_summary.js >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      # ── 8. Upload ALL report artifacts ────────────────────────────────────────
      - name: 📤 Upload DAST Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DAST-Security-Report-Run-${{ github.run_number }}
          path: |
            aero-navigator-web/automated_test/DAST_Security_Report.xlsx
            aero-navigator-web/automated_test/report.json
            aero-navigator-web/automated_test/savepoint.json
          retention-days: 90

      # ── 9. Stop server ────────────────────────────────────────────────────────
      - name: 🛑 Stop Server
        if: always()
        run: kill $SERVER_PID 2>/dev/null || true

      # ── 10. Fail CI if CRITICAL findings exist ────────────────────────────────
      - name: ❌ Fail on CRITICAL Findings
        working-directory: aero-navigator-web
        run: |
          CRITICAL=$(node -e "
            const r = require('./automated_test/report.json');
            console.log(r.filter(x => x.finding && x.severity === 'CRITICAL').length);
          " 2>/dev/null || echo "0")
          HIGH=$(node -e "
            const r = require('./automated_test/report.json');
            console.log(r.filter(x => x.finding && x.severity === 'HIGH').length);
          " 2>/dev/null || echo "0")
          echo "::notice::🔴 CRITICAL: $CRITICAL  🟠 HIGH: $HIGH"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "::error::🔴 $CRITICAL CRITICAL finding(s) — review the DAST Excel Report artifact."
            exit 1
          fi
          if [ "$HIGH" -gt "0" ]; then
            echo "::warning::🟠 $HIGH HIGH finding(s) — review the DAST Excel Report artifact."
          fi
          echo "✅ No CRITICAL findings. Pipeline passed."
