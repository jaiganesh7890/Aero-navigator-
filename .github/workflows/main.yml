name: Aero Navigator CI/CD

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  web-build:
    name: Build Web Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aero-navigator-web

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aero-navigator-web/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Check Formatting
        run: npm run lint --if-present

      - name: Run Unit Tests
        run: npm test --if-present

      - name: Build Application
        run: npm run build --if-present

  selenium-tests:
    name: Selenium Automation Tests
    runs-on: ubuntu-latest
    needs: web-build

    defaults:
      run:
        working-directory: selenium-web-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: selenium-web-tests/package-lock.json

      - name: Install Packages
        run: npm install

      - name: Execute Selenium Tests
        run: |
          if [ -f "load_test_runner.js" ]; then
            node load_test_runner.js
          elif [ -f "runner.js" ]; then
            node runner.js
          else
            echo "No Selenium runner found."
          fi

      - name: Upload Selenium Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Reports
          path: |
            selenium-web-tests/reports/**
            selenium-web-tests/*.xlsx
            selenium-web-tests/*.html

  appium-tests:
    name: Appium Mobile Tests
    runs-on: ubuntu-latest
    needs: web-build

    defaults:
      run:
        working-directory: appium-mobile-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: appium-mobile-tests/package-lock.json

      - name: Install Packages
        run: npm install

      - name: Run Appium Tests
        run: |
          if [ -f "runner.js" ]; then
            node runner.js
          else
            echo "No Appium runner found."
          fi

      - name: Upload Appium Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Appium-Reports
          path: |
            appium-mobile-tests/reports/**
            appium-mobile-tests/*.xlsx
            appium-mobile-tests/*.html
